name: Publish presentation site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-only.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://mmiabr3je4.execute-api.us-east-1.amazonaws.com
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend -- --base=/Audio-Architecture-Playlist-Structuring-API/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
