name: CI and AWS Deployment - Audio Architecture System

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: audio-architecture-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Unit Tests & Linting
    runs-on: ubuntu-latest
    env:
      LOCAL_ONLY: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s backend/tests -v

      - name: Verify Lambda Deployment Import
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.lambda_handler import handler; assert callable(handler)"

      - name: Run HTTP Integration and Engine Benchmark
        env:
          LOCAL_DATA_DIR: ${{ runner.temp }}/audio-api-tests
        run: python scripts/verify_project.py

      - name: Upload Verification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: docs/TEST_RESULTS.*

  build-frontend:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Application
        run: |
          node scripts/test_frontend_api.mjs
          cd frontend
          npm run lint
          npm run build

  terraform-check:
    name: Terraform Quality & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Terraform Init (Backend verification)
        run: |
          terraform -chdir=terraform init -backend=false

      - name: Terraform Validation
        run: |
          terraform -chdir=terraform validate

  # Deployment runs in two approved stages: the plan is produced and published
  # first, then a second production approval applies exactly that saved plan.
  plan-aws:
    name: Plan AWS Infrastructure
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.AWS_DEPLOY_ENABLED == 'true' }}
    needs: [test-backend, build-frontend, terraform-check]
    runs-on: ubuntu-latest
    environment: planning
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Create Terraform Plan
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=audio-architecture/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"
          terraform -chdir=terraform plan -input=false -out=tfplan
          terraform -chdir=terraform show -no-color tfplan > terraform/tfplan.txt

      - name: Publish Plan for Review
        run: |
          {
            echo "## Terraform plan for review"
            echo "Approve the **Apply Reviewed Plan** job only if these changes are expected."
            echo '```'
            head -c 900000 terraform/tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Lambda archive is uploaded with the plan because a saved plan must
      # be applied against the exact payload it was computed from.
      - name: Upload Saved Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          retention-days: 3
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/lambda_payload.zip

  deploy-aws:
    name: Apply Reviewed Plan and Publish Web Application
    needs: [plan-aws]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.infrastructure.outputs.api_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Saved Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Apply Reviewed Plan
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=audio-architecture/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"
          terraform -chdir=terraform apply -input=false tfplan

      - name: Read Deployment Outputs
        id: infrastructure
        run: |
          echo "api_url=$(terraform -chdir=terraform output -raw api_gateway_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Smoke Test Deployed API
        env:
          API_URL: ${{ steps.infrastructure.outputs.api_url }}
        run: |
          python scripts/verify_project.py --api-url "$API_URL" --report docs/DEPLOYED_TEST_RESULTS.json

      - name: Upload Deployed Verification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployed-verification-results
          path: docs/DEPLOYED_TEST_RESULTS.*

  deploy-pages:
    name: Publish Frontend to GitHub Pages
    needs: [deploy-aws]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Frontend for AWS API
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-aws.outputs.api_url }}
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend -- --base=/Audio-Architecture-Playlist-Structuring-API/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy GitHub Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
